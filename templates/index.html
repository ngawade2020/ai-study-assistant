<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Study Assistant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="app">

        <!-- Sidebar -->

        <aside class="sidebar">

            <h1 class="logo">
                AI Study Assistant
            </h1>

            <button class="new-chat-btn">
                + New Chat
            </button>

            <div class="chat-history">

                <div class="history-item active">
                    Current Chat
                </div>

            </div>

        </aside>

        <!-- Main Content -->

        <main class="main-content">

            <!-- Topbar -->

            <div class="topbar">

                <h2>AI Chat</h2>

                <div class="status">
                    ● Online
                </div>

            </div>

            <!-- Chat Box -->

            <div class="chat-box"
                 id="chat-box">

                {% if chat_history|length == 0 %}

                    <div class="empty-state">

                        <h1>
                            How can I help you today?
                        </h1>

                        <p>
                            Ask questions or upload PDFs.
                        </p>

                    </div>

                {% endif %}

                {% for chat in chat_history %}

                    <!-- User Message -->

                    <div class="message-wrapper">

                        <div class="avatar user-avatar">
                            U
                        </div>

                        <div class="message-content">

                            <div class="message user-message">

                                {{ chat.question }}

                            </div>

                            <div class="timestamp">

                                {{ chat.time }}

                            </div>

                        </div>

                    </div>

                    <!-- AI Message -->

                    <div class="message-wrapper">

                        <div class="avatar ai-avatar">
                            AI
                        </div>

                        <div class="message-content">

                            <div class="message ai-message">

                                <pre>{{ chat.response }}</pre>

                            </div>

                            <div class="timestamp">

                                {{ chat.time }}

                            </div>

                        </div>

                    </div>

                {% endfor %}

            </div>

            <!-- Bottom Container -->

            <div class="bottom-container">

                <!-- Chat Form -->

                <form method="POST"
                      class="chat-form"
                      id="chat-form">

                    <textarea
                        name="question"
                        placeholder="Message AI Study Assistant..."
                        rows="1"></textarea>

                    <button type="submit">

                        <span id="button-text">
                            Send
                        </span>

                    </button>

                </form>

                <!-- PDF Upload Form -->

                <form method="POST"
                      enctype="multipart/form-data"
                      class="upload-form">

                    <label class="upload-btn">

                        Upload PDF

                        <input type="file"
                               name="pdf_file"
                               accept=".pdf"
                               required>

                    </label>

                    <button type="submit">

                        Summarize

                    </button>

                </form>

            </div>

        </main>

    </div>

    <!-- Scripts -->

    <script>

        // Auto Scroll

        const chatBox =
            document.getElementById("chat-box");

        chatBox.scrollTop =
            chatBox.scrollHeight;

        // Loading Effect

        const form =
            document.getElementById("chat-form");

        form.addEventListener("submit", function () {

            document.getElementById(
                "button-text"
            ).innerText = "Thinking...";

        });

    </script>

</body>

</html>
